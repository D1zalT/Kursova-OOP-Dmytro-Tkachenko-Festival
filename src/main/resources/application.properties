spring.application.name=festival-service
server.port=8080

# --- PostgreSQL ---
# Перед запуском створіть БД: CREATE DATABASE festival_db;
spring.datasource.url=jdbc:postgresql://localhost:5432/festival_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# ddl-auto=update - Hibernate сам створює/оновлює таблиці за entity-класами (зручно для лаб. роботи)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
